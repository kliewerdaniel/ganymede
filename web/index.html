<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganymede — Matter Intelligence</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface-hover: #1a1a25;
            --border: #2a2a3a;
            --text: #e8e8f0;
            --text-muted: #8888a0;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
            --code-bg: #0d0d14;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 { font-size: 1.25rem; font-weight: 600; }

        .matter-selector { display: flex; align-items: center; gap: 0.5rem; }

        .header select {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
        }

        .main { display: flex; flex: 1; overflow: hidden; }

        .sidebar {
            width: 280px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-section { padding: 1rem; border-bottom: 1px solid var(--border); }

        .sidebar-section h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
        }

        .doc-list, .history-list, .artifact-list {
            list-style: none;
            overflow-y: auto;
            max-height: 250px;
        }

        .doc-list li, .history-list li, .artifact-list li {
            padding: 0.5rem 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .doc-list li:hover, .history-list li:hover, .artifact-list li:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        .artifact-list li .artifact-status {
            padding: 0.15rem 0.4rem;
            border-radius: 3px;
            font-size: 0.65rem;
            text-transform: uppercase;
            margin-right: 0.4rem;
        }

        .artifact-status.draft { background: var(--surface); border: 1px solid var(--border); }
        .artifact-status.under_review { background: var(--warning); color: black; }
        .artifact-status.approved { background: var(--success); color: white; }
        .artifact-status.rejected { background: var(--error); color: white; }

        .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        .query-area { padding: 1.5rem 2rem; border-bottom: 1px solid var(--border); }

        .query-input-wrapper { display: flex; gap: 0.75rem; align-items: flex-end; }

        .query-input {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text);
            font-size: 0.95rem;
            resize: none;
            min-height: 60px;
            max-height: 200px;
        }

        .query-input:focus { outline: none; border-color: var(--accent); }
        .query-input::placeholder { color: var(--text-muted); }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.15s;
        }

        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        .artifact-btn {
            padding: 0.4rem 0.8rem;
            font-size: 0.75rem;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-muted);
            border-radius: 4px;
            cursor: pointer;
        }

        .artifact-btn:hover { border-color: var(--accent); color: var(--text); }

        .answer-area { flex: 1; display: flex; overflow: hidden; }

        .answer-panel { flex: 1; padding: 1.5rem 2rem; overflow-y: auto; }

        .answer-panel h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; }

        .answer-text { line-height: 1.7; font-size: 0.95rem; }

        .citations-list { list-style: none; margin-top: 1.5rem; }

        .citation-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.75rem;
        }

        .citation-card .doc-name { font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; }

        .citation-card .passage {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
            padding: 0.5rem;
            background: var(--code-bg);
            border-radius: 4px;
            border-left: 3px solid var(--accent);
            cursor: pointer;
        }

        .citation-card .passage:hover { background: var(--surface-hover); }

        .citation-card .scores {
            display: flex;
            gap: 1rem;
            margin-top: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .citation-card .feedback { display: flex; gap: 0.5rem; margin-top: 0.75rem; flex-wrap: wrap; }

        .citation-card .feedback button {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .citation-card .feedback button:hover { border-color: var(--accent); color: var(--text); }

        .citation-card .feedback button.active-supporting { background: var(--success); color: white; border-color: var(--success); }
        .citation-card .feedback button.active-weak { background: var(--warning); color: white; border-color: var(--warning); }
        .citation-card .feedback button.active-wrong { background: var(--error); color: white; border-color: var(--error); }
        .citation-card .feedback button.active-inaccessible { background: var(--text-muted); color: white; border-color: var(--text-muted); }

        .source-panel {
            width: 45%;
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            background: var(--surface);
        }

        .source-panel .panel-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .source-panel .panel-header h3 { font-size: 0.875rem; font-weight: 600; }

        .source-panel .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.25rem;
        }

        .source-panel .panel-content { flex: 1; overflow-y: auto; padding: 1rem; }

        .source-panel .page-text { font-size: 0.85rem; line-height: 1.6; white-space: pre-wrap; }

        .source-panel .page-text .highlight {
            background: rgba(99, 102, 241, 0.3);
            padding: 0.1rem 0.2rem;
            border-radius: 2px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            padding: 2rem;
        }

        .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }

        .loading { display: flex; align-items: center; gap: 0.5rem; color: var(--text-muted); font-size: 0.875rem; }

        .loading .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .status-bar {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 0.5rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .status-item { display: flex; align-items: center; gap: 0.5rem; }

        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
        .status-dot.error { background: var(--error); }
    </style>
</head>
<body>
    <header class="header">
        <h1>Ganymede</h1>
        <div class="matter-selector">
            <label for="matter-select">Matter:</label>
            <select id="matter-select"><option value="">Loading...</option></select>
        </div>
    </header>

    <main class="main">
        <aside class="sidebar">
            <div class="sidebar-section">
                <h3>Documents</h3>
                <ul class="doc-list" id="doc-list"><li>Loading...</li></ul>
            </div>
            <div class="sidebar-section">
                <h3>Artifacts</h3>
                <ul class="artifact-list" id="artifact-list"><li>No artifacts yet</li></ul>
            </div>
            <div class="sidebar-section">
                <h3>History</h3>
                <ul class="history-list" id="history-list"><li>No history yet</li></ul>
            </div>
        </aside>

        <section class="content">
            <div class="query-area">
                <div class="query-input-wrapper">
                    <textarea class="query-input" id="query-input" placeholder="Ask a question about the matter..." rows="2"></textarea>
                    <button class="btn btn-primary" id="ask-btn">Ask</button>
                </div>
                <div style="display: flex; gap: 0.5rem; margin-top: 0.75rem;">
                    <button class="artifact-btn" id="new-chronology-btn">+ Chronology</button>
                    <button class="artifact-btn" id="new-issue-table-btn">+ Issue Table</button>
                    <button class="artifact-btn" id="new-memo-btn">+ Memo</button>
                </div>
            </div>

            <div class="answer-area">
                <div class="answer-panel" id="answer-panel">
                    <div class="empty-state">
                        <div class="icon">🔍</div>
                        <p>Ask a question or create an artifact. Every answer comes with citations you can verify.</p>
                    </div>
                </div>

                <div class="source-panel" id="source-panel" style="display: none;">
                    <div class="panel-header">
                        <h3 id="source-title">Source</h3>
                        <button class="close-btn" id="close-source">&times;</button>
                    </div>
                    <div class="panel-content">
                        <div class="page-text" id="page-text"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="status-bar">
        <div class="status-item">
            <span class="status-dot" id="api-status"></span>
            <span id="api-status-text">Checking API...</span>
        </div>
        <div class="status-item">
            <span id="artifact-count">0 artifacts</span>
        </div>
    </footer>

    <script>
        const API = '/api/v1';
        let currentMatter = null;
        let documents = [];
        let history = [];
        let currentCitations = [];
        let currentArtifactId = null;

        const $ = (id) => document.getElementById(id);

        async function init() {
            await checkHealth();
            await loadMatters();
            loadHistory();
        }

        async function checkHealth() {
            try {
                const resp = await fetch(`${API}/healthz`);
                if (resp.ok) {
                    $('api-status').classList.remove('error');
                    $('api-status-text').textContent = 'API connected';
                } else { throw new Error(); }
            } catch (e) {
                $('api-status').classList.add('error');
                $('api-status-text').textContent = 'API unavailable';
            }
        }

        async function loadMatters() {
            try {
                const resp = await fetch(`${API}/matters`);
                const matters = await resp.json();
                $('matter-select').innerHTML = matters.map(m =>
                    `<option value="${m.id}">${m.name}</option>`
                ).join('');
                if (matters.length > 0) {
                    currentMatter = matters[0];
                    $('matter-select').value = currentMatter.id;
                    await loadDocuments(currentMatter.id);
                    await loadArtifacts(currentMatter.id);
                }
            } catch (e) {
                $('matter-select').innerHTML = '<option value="">Failed to load</option>';
            }
        }

        async function loadDocuments(matterId) {
            try {
                const resp = await fetch(`${API}/matters/${matterId}/documents`);
                documents = await resp.json();
                $('doc-list').innerHTML = documents.map(d =>
                    `<li data-id="${d.id}">${d.original_filename}</li>`
                ).join('');
                $('doc-list').querySelectorAll('li').forEach(li =>
                    li.addEventListener('click', () => showDocument(li.dataset.id))
                );
            } catch (e) {
                $('doc-list').innerHTML = '<li>Failed to load</li>';
            }
        }

        async function loadArtifacts(matterId) {
            try {
                const resp = await fetch(`${API}/matters/${matterId}/artifacts`);
                const artifacts = await resp.json();
                if (artifacts.length === 0) {
                    $('artifact-list').innerHTML = '<li>No artifacts yet</li>';
                    $('artifact-count').textContent = '0 artifacts';
                } else {
                    $('artifact-list').innerHTML = artifacts.map(a =>
                        `<li data-id="${a.id}">
                            <span class="artifact-status ${a.status}">${a.status}</span>
                            ${a.title.substring(0, 40)}
                         </li>`
                    ).join('');
                    $('artifact-list').querySelectorAll('li').forEach(li =>
                        li.addEventListener('click', () => loadArtifact(li.dataset.id))
                    );
                    $('artifact-count').textContent = `${artifacts.length} artifact${artifacts.length > 1 ? 's' : ''}`;
                }
            } catch (e) {
                $('artifact-list').innerHTML = '<li>Failed to load</li>';
            }
        }

        async function loadArtifact(artifactId) {
            try {
                const resp = await fetch(`${API}/artifacts/${artifactId}`);
                const artifact = await resp.json();
                currentArtifactId = artifactId;

                if (artifact.artifact_type === 'memo') {
                    renderMemoArtifact(artifact);
                } else if (artifact.artifact_type === 'chronology') {
                    renderChronologyArtifact(artifact);
                } else if (artifact.artifact_type === 'issue_table') {
                    renderIssueTableArtifact(artifact);
                }

                await loadFeedback(artifactId);
            } catch (e) {
                $('answer-panel').innerHTML = `<div class="empty-state"><p>Error loading artifact</p></div>`;
            }
        }

        async function loadFeedback(artifactId) {
            try {
                const resp = await fetch(`${API}/artifacts/${artifactId}/feedback`);
                const feedback = await resp.json();
                feedback.forEach(f => {
                    const btn = document.querySelector(
                        `.feedback button[data-doc="${f.citation_document_id}"][data-fb="${f.feedback}"]`
                    );
                    if (btn) btn.classList.add(`active-${f.feedback}`);
                });
            } catch (e) { /* ignore */ }
        }

        function renderMemoArtifact(artifact) {
            const content = artifact.content;
            let html = `<h2>${artifact.title}</h2>`;
            html += `<div style="margin-bottom: 1rem;"><span class="artifact-status ${artifact.status}">${artifact.status}</span></div>`;

            if (content.question) {
                html += `<h3>Question</h3><p style="margin-bottom: 1rem;">${content.question}</p>`;
            }

            if (content.record && content.record.passages) {
                html += `<h3>Record (${content.record.citation_count} citations)</h3><ul class="citations-list">`;
                content.record.passages.forEach((p, i) => {
                    html += `
                        <li class="citation-card">
                            <div class="doc-name">${p.document_name} (page ${p.page})</div>
                            <div class="passage" data-doc="${p.document_id}" data-page="${p.page}" data-sha="${p.sha256}">${p.quoted_text ? p.quoted_text.substring(0, 500) : ''}</div>
                            <div class="feedback">
                                <button data-doc="${p.document_id}" data-page="${p.page}" data-sha="${p.sha256}" data-fb="supporting">✓ Supporting</button>
                                <button data-doc="${p.document_id}" data-page="${p.page}" data-sha="${p.sha256}" data-fb="weak">~ Weak</button>
                                <button data-doc="${p.document_id}" data-page="${p.page}" data-sha="${p.sha256}" data-fb="wrong">✗ Wrong</button>
                                <button data-doc="${p.document_id}" data-page="${p.page}" data-sha="${p.sha256}" data-fb="inaccessible">⊘ Inaccessible</button>
                            </div>
                        </li>`;
                });
                html += `</ul>`;
            }

            if (content.analysis) {
                html += `<h3>Analysis</h3><p style="color: var(--text-muted); font-style: italic;">${content.analysis.constraints || 'For attorney completion'}</p>`;
            }

            if (content.limits) {
                html += `<h3>Limits</h3><p style="color: var(--text-muted); font-size: 0.85rem;">${content.limits.disclaimer}</p>`;
            }

            if (artifact.status === 'draft') {
                html += `<div style="margin-top: 1rem;"><button class="btn btn-primary" onclick="submitForReview('${artifact.id}')">Submit for Review</button></div>`;
            } else if (artifact.status === 'under_review') {
                html += `<div style="margin-top: 1rem; display: flex; gap: 0.5rem;">
                    <button class="btn btn-primary" onclick="approveArtifact('${artifact.id}')">Approve</button>
                    <button class="artifact-btn" onclick="rejectArtifact('${artifact.id}')">Reject</button>
                </div>`;
            }

            $('answer-panel').innerHTML = html;
            document.querySelectorAll('.feedback button').forEach(btn => btn.addEventListener('click', () => submitFeedback(btn)));
            document.querySelectorAll('.citation-card .passage').forEach(el => {
                el.addEventListener('click', () => showCitationSource({
                    document_id: el.dataset.doc,
                    page: el.dataset.page,
                    quoted_text: el.textContent,
                    sha256: el.dataset.sha,
                }));
            });
        }

        function renderChronologyArtifact(artifact) {
            const content = artifact.content;
            let html = `<h2>${artifact.title}</h2>`;
            html += `<div style="margin-bottom: 1rem;"><span class="artifact-status ${artifact.status}">${artifact.status}</span></div>`;
            html += `<p style="color: var(--text-muted); margin-bottom: 1rem;">${content.unextracted_count} events (dates unextracted)</p>`;

            if (content.events) {
                html += `<ul class="citations-list">`;
                content.events.forEach((e, i) => {
                    html += `
                        <li class="citation-card">
                            <div class="doc-name">${e.source.document_name} (page ${e.source.page})</div>
                            <div class="passage" data-doc="${e.source.document_id}" data-page="${e.source.page}" data-sha="${e.source.sha256}">${e.event.substring(0, 400)}</div>
                            <div class="feedback">
                                <button data-doc="${e.source.document_id}" data-page="${e.source.page}" data-sha="${e.source.sha256}" data-fb="supporting">✓ Supporting</button>
                                <button data-doc="${e.source.document_id}" data-page="${e.source.page}" data-sha="${e.source.sha256}" data-fb="weak">~ Weak</button>
                                <button data-doc="${e.source.document_id}" data-page="${e.source.page}" data-sha="${e.source.sha256}" data-fb="wrong">✗ Wrong</button>
                                <button data-doc="${e.source.document_id}" data-page="${e.source.page}" data-sha="${e.source.sha256}" data-fb="inaccessible">⊘ Inaccessible</button>
                            </div>
                        </li>`;
                });
                html += `</ul>`;
            }

            if (artifact.status === 'draft') {
                html += `<div style="margin-top: 1rem;"><button class="btn btn-primary" onclick="submitForReview('${artifact.id}')">Submit for Review</button></div>`;
            }

            $('answer-panel').innerHTML = html;
            document.querySelectorAll('.feedback button').forEach(btn => btn.addEventListener('click', () => submitFeedback(btn)));
        }

        function renderIssueTableArtifact(artifact) {
            const content = artifact.content;
            let html = `<h2>${artifact.title}</h2>`;
            html += `<div style="margin-bottom: 1rem;"><span class="artifact-status ${artifact.status}">${artifact.status}</span></div>`;
            html += `<p style="color: var(--text-muted); margin-bottom: 1rem;">${content.unreviewed_count} issues (unreviewed)</p>`;

            if (content.issues) {
                html += `<ul class="citations-list">`;
                content.issues.forEach((iss, i) => {
                    const sup = iss.support[0] || {};
                    html += `
                        <li class="citation-card">
                            <div class="doc-name">Issue ${i + 1}</div>
                            <div class="passage" data-doc="${sup.document_id}" data-page="${sup.page}" data-sha="${sup.sha256}">${iss.issue.substring(0, 400)}</div>
                            <div class="feedback">
                                <button data-doc="${sup.document_id}" data-page="${sup.page}" data-sha="${sup.sha256}" data-fb="supporting">✓ Supporting</button>
                                <button data-doc="${sup.document_id}" data-page="${sup.page}" data-sha="${sup.sha256}" data-fb="weak">~ Weak</button>
                                <button data-doc="${sup.document_id}" data-page="${sup.page}" data-sha="${sup.sha256}" data-fb="wrong">✗ Wrong</button>
                                <button data-doc="${sup.document_id}" data-page="${sup.page}" data-sha="${sup.sha256}" data-fb="inaccessible">⊘ Inaccessible</button>
                            </div>
                        </li>`;
                });
                html += `</ul>`;
            }

            if (artifact.status === 'draft') {
                html += `<div style="margin-top: 1rem;"><button class="btn btn-primary" onclick="submitForReview('${artifact.id}')">Submit for Review</button></div>`;
            }

            $('answer-panel').innerHTML = html;
            document.querySelectorAll('.feedback button').forEach(btn => btn.addEventListener('click', () => submitFeedback(btn)));
        }

        async function submitFeedback(btn) {
            if (!currentArtifactId) return;
            const docId = btn.dataset.doc;
            const page = parseInt(btn.dataset.page);
            const sha = btn.dataset.sha;
            const feedback = btn.dataset.fb;

            btn.parentElement.querySelectorAll('button').forEach(b => b.className = '');
            btn.classList.add(`active-${feedback}`);

            try {
                await fetch(`${API}/artifacts/${currentArtifactId}/feedback`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        citation_document_id: docId,
                        citation_page: page,
                        citation_sha256: sha,
                        feedback: feedback,
                    }),
                });
            } catch (e) {
                console.error('Feedback failed:', e);
            }
        }

        async function submitForReview(artifactId) {
            try {
                await fetch(`${API}/artifacts/${artifactId}/submit`, { method: 'POST' });
                await loadArtifact(artifactId);
                if (currentMatter) await loadArtifacts(currentMatter.id);
            } catch (e) { console.error(e); }
        }

        async function approveArtifact(artifactId) {
            try {
                await fetch(`${API}/artifacts/${artifactId}/approve`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ comment: 'Approved' }),
                });
                await loadArtifact(artifactId);
                if (currentMatter) await loadArtifacts(currentMatter.id);
            } catch (e) { console.error(e); }
        }

        async function rejectArtifact(artifactId) {
            const reason = prompt('Reason for rejection:');
            if (!reason) return;
            try {
                await fetch(`${API}/artifacts/${artifactId}/reject`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reason }),
                });
                await loadArtifact(artifactId);
                if (currentMatter) await loadArtifacts(currentMatter.id);
            } catch (e) { console.error(e); }
        }

        function loadHistory() {
            const saved = localStorage.getItem('ganymede_history');
            if (saved) { history = JSON.parse(saved); renderHistory(); }
        }

        function saveHistory() {
            localStorage.setItem('ganymede_history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            if (history.length === 0) {
                $('history-list').innerHTML = '<li>No history yet</li>';
                return;
            }
            $('history-list').innerHTML = history.map((h, i) =>
                `<li data-index="${i}">${h.question.substring(0, 60)}...</li>`
            ).join('');
            $('history-list').querySelectorAll('li').forEach(li =>
                li.addEventListener('click', () => {
                    const item = history[li.dataset.index];
                    $('query-input').value = item.question;
                    renderQueryResult(item);
                })
            );
        }

        async function askQuestion() {
            const question = $('query-input').value.trim();
            if (!question || !currentMatter) return;

            $('ask-btn').disabled = true;
            $('answer-panel').innerHTML = '<div class="loading"><div class="spinner"></div>Searching...</div>';

            try {
                const resp = await fetch(`${API}/matters/${currentMatter.id}/ask-async`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query_text: question, top_k: 5 }),
                });
                const data = await resp.json();
                await pollForResults(data.query_id);
            } catch (e) {
                $('answer-panel').innerHTML = `<div class="empty-state"><p>Error: ${e.message}</p></div>`;
            } finally {
                $('ask-btn').disabled = false;
            }
        }

        async function pollForResults(queryId) {
            for (let i = 0; i < 60; i++) {
                const resp = await fetch(`${API}/ask/${queryId}/status`);
                const data = await resp.json();

                if (data.status === 'complete') {
                    currentCitations = data.citations;
                    const result = {
                        question: data.question,
                        citations: data.citations,
                        answer: data.result_count > 0
                            ? `Found ${data.result_count} verified passage(s).`
                            : 'Not found in approved matter sources.',
                        timestamp: new Date().toISOString(),
                    };
                    history.unshift(result);
                    if (history.length > 20) history.pop();
                    saveHistory();
                    renderQueryResult(result);
                    return;
                }

                if (data.status === 'error') {
                    $('answer-panel').innerHTML = `<div class="empty-state"><p>Error: ${data.error}</p></div>`;
                    return;
                }

                if (data.citations && data.citations.length > 0 && i === 0) {
                    currentCitations = data.citations;
                    renderQueryResult({
                        question: data.question,
                        citations: data.citations,
                        answer: `Searching... ${data.result_count} results, verifying...`,
                    });
                }

                await new Promise(r => setTimeout(r, 1000));
            }
            $('answer-panel').innerHTML = '<div class="empty-state"><p>Verification timeout.</p></div>';
        }

        function renderQueryResult(result) {
            const citations = result.citations;
            let html = `<h2>Answer</h2><div class="answer-text">${result.answer}</div>`;

            if (citations.length > 0) {
                html += `<h2 style="margin-top: 1.5rem;">Citations</h2><ul class="citations-list">`;
                citations.forEach((c, i) => {
                    const docName = documents.find(d => d.id === c.document_id)?.original_filename || 'Unknown';
                    const scores = c.retrieval_scores || {};
                    html += `
                        <li class="citation-card">
                            <div class="doc-name">${docName} (page ${c.page})</div>
                            <div class="passage" data-doc="${c.document_id}" data-page="${c.page}" data-sha="${c.sha256}">${c.quoted_text.substring(0, 300)}${c.quoted_text.length > 300 ? '...' : ''}</div>
                            <div class="scores">
                                <span>RRF: ${(scores.rrf_score || 0).toFixed(4)}</span>
                                <span>Vector: ${(scores.vector_similarity || 0).toFixed(3)}</span>
                            </div>
                        </li>`;
                });
                html += `</ul>`;
            }

            $('answer-panel').innerHTML = html;
            document.querySelectorAll('.citation-card .passage').forEach(el => {
                el.addEventListener('click', () => showCitationSource({
                    document_id: el.dataset.doc,
                    page: el.dataset.page,
                    quoted_text: el.textContent,
                    sha256: el.dataset.sha,
                }));
            });
        }

        function showCitationSource(citation) {
            const doc = documents.find(d => d.id === citation.document_id);
            $('source-title').textContent = `${doc?.original_filename || 'Document'} — Page ${citation.page}`;
            $('page-text').innerHTML = `<span class="highlight">${citation.quoted_text}</span>`;
            $('source-panel').style.display = 'flex';
        }

        function showDocument(docId) {
            const doc = documents.find(d => d.id === docId);
            if (!doc) return;
            $('source-title').textContent = doc.original_filename;
            $('page-text').textContent = 'Loading...';
            $('source-panel').style.display = 'flex';

            fetch(`${API}/documents/${docId}/pages`)
                .then(r => r.json())
                .then(pages => {
                    $('page-text').textContent = pages.map(p => p.text).join('\n\n---\n\n');
                })
                .catch(() => { $('page-text').textContent = 'Failed to load.'; });
        }

        async function createArtifact(type) {
            if (!currentMatter) return;
            const question = prompt(`${type === 'memo' ? 'Question' : 'Query'} for ${type}:`);
            if (!question) return;

            try {
                const resp = await fetch(`${API}/matters/${currentMatter.id}/artifacts`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ artifact_type: type, query_text: question }),
                });
                const artifact = await resp.json();
                currentArtifactId = artifact.id;
                await loadArtifact(artifact.id);
                await loadArtifacts(currentMatter.id);
            } catch (e) {
                alert(`Failed: ${e.message}`);
            }
        }

        $('matter-select').addEventListener('change', async () => {
            const matters = await (await fetch(`${API}/matters`)).json();
            currentMatter = matters.find(m => m.id === $('matter-select').value);
            await loadDocuments(currentMatter.id);
            await loadArtifacts(currentMatter.id);
        });

        $('ask-btn').addEventListener('click', askQuestion);
        $('query-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); askQuestion(); }
        });

        $('close-source').addEventListener('click', () => { $('source-panel').style.display = 'none'; });

        $('new-chronology-btn').addEventListener('click', () => createArtifact('chronology'));
        $('new-issue-table-btn').addEventListener('click', () => createArtifact('issue_table'));
        $('new-memo-btn').addEventListener('click', () => createArtifact('memo'));

        init();
    </script>
</body>
</html>
