# Ganymede — Docker Compose Configuration

version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg14
    environment:
      POSTGRES_USER: ganymede
      POSTGRES_PASSWORD: ganymede
      POSTGRES_DB: ganymede
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ganymede"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://ganymede:ganymede@db:5432/ganymede
      STORAGE_PATH: /data/storage
    volumes:
      - api_storage:/data/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  db_data:
  api_storage:
