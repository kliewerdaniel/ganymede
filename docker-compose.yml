# Ganymede — Docker Compose Configuration

services:
  db:
    image: pgvector/pgvector:pg14
    environment:
      POSTGRES_USER: ganymede
      POSTGRES_PASSWORD: ganymede
      POSTGRES_DB: ganymede
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ganymede"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://ganymede:ganymede@db:5432/ganymede
      STORAGE_PATH: /data/storage
      # Ollama on host — primary is host.docker.internal (works from container to host).
      # Fallback to localhost only runs if host.docker.internal is unavailable.
      OLLAMA_ENDPOINTS: "host.docker.internal:11434,localhost:11434"
      # Verifier Ollama URL — uses host.docker.internal by default
      OLLAMA_URL: "http://host.docker.internal:11434"
    volumes:
      - api_storage:/data/storage
      - ./api:/app  # Mount local code for development
      - ./docs:/docs  # Mount docs so verifier prompt loads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # ClamAV service deferred: clamav/clamav image does not support ARM64.
  # For pilot deployments on ARM64 (Apple Silicon), use a separate x86_64 host
  # or install ClamAV directly in the API container.
  # clamav:
  #   image: clamav/clamav:latest
  #   ports:
  #     - "3310:3310"
  #   volumes:
  #     - clamav_data:/var/lib/clamav

volumes:
  db_data:
  api_storage:
